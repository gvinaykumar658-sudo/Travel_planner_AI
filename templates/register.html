{% extends 'base.html' %}

{% block content %}

<div class="auth-card" style="background: linear-gradient(135deg, #0f1724 0%, #1a2744 100%); color: #ffffff; padding: 32px 28px; max-width: 340px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(124,58,237,0.2); margin: 40px auto;">
    <h2 style="margin: 0 0 24px 0; font-size: 1.6rem; font-weight: 700; color: #fbbf24; text-align: center; border-bottom: 2px solid #7c3aed; padding-bottom: 12px;">Register</h2>

    <form id="registerForm" method="POST" style="display: flex; flex-direction: column; gap: 18px; padding-top: 6px;">
        {% csrf_token %}
        {% if error %}
            <div id="serverError" data-text="{{ error }}"></div>
        {% endif %}
        <input id="username" name="username" placeholder="Username" style="padding: 10px 0; font-size: 0.9rem; border: none; border-bottom: 2px solid rgba(255,255,255,0.3); background: transparent; color: #ffffff; border-radius: 0; font-weight: 500; transition: border-color 0.3s ease;" required>
        <input id="password" name="password" type="password" placeholder="Password" style="padding: 10px 0; font-size: 0.9rem; border: none; border-bottom: 2px solid rgba(255,255,255,0.3); background: transparent; color: #ffffff; border-radius: 0; font-weight: 500; transition: border-color 0.3s ease;" required>
        <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm Password"
style="padding: 10px 0; font-size: 0.9rem; border: none; border-bottom: 2px solid rgba(255,255,255,0.3); background: transparent; color: #ffffff; border-radius: 0; font-weight: 500; transition: border-color 0.3s ease;" required>
        <button type="submit" style="padding: 11px 16px; font-size: 0.9rem; margin-top: 12px; border: none; border-radius: 6px; background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%); color: #ffffff; cursor: pointer; font-weight: 700; box-shadow: 0 4px 14px rgba(124,58,237,0.3); transition: all 0.3s ease;">Register</button>
    </form>
</div>

{% if error %}
<script>
    document.addEventListener('DOMContentLoaded', function(){
        if (window.Swal) Swal.fire({icon:'error', title:'Registration Failed', text: document.getElementById('serverError').dataset.text, confirmButtonColor: '#7c3aed'});
        else alert(document.getElementById('serverError').dataset.text);
    });
</script>
{% endif %}

<script>
    document.addEventListener('DOMContentLoaded', function(){
        const form = document.getElementById('registerForm');
        if (form) {
            form.addEventListener('submit', function(e){
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                if (!username || !password) {
                    Swal.fire({icon:'warning', title:'Missing Fields', text:'Please enter both username and password', confirmButtonColor: '#7c3aed'});
                    return;
                }
                
                // Submit form
                const formData = new FormData(form);
                fetch(form.action || '', {
                    method: 'POST',
                    body: formData,
                    headers: {'X-Requested-With': 'XMLHttpRequest'}
                })
                .then(response => {
                    if (response.ok) {
                        Swal.fire({icon:'success', title:'Account Created!', text:'Registration successful. Welcome aboard!', timer:1500, timerProgressBar:true, confirmButtonColor: '#7c3aed'}).then(() => {
                            window.location.href = '/';
                        });
                    } else {
                        return response.json().then(data => {
                            throw new Error(data.error || 'Registration failed');
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({icon:'error', title:'Registration Failed', text: error.message, confirmButtonColor: '#7c3aed'});
                });
            });
        }
    });
</script>

{% endblock %}
