spring.application.name=travelmate-backend

# Database Configuration with Environment Variables and Local Fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travelmate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:traveluser}
spring.datasource.password=${DB_PASSWORD:vinay@8247}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TravelMateHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=${PORT:8090}
server.error.include-message=always
server.error.include-binding-errors=always
spring.main.allow-bean-definition-overriding=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:travelmate-production-grade-256-bit-secret-key-for-jwt-tokens-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Application Base API
server.servlet.context-path=